name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    name: Checks (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
          - name: Windows
            os: windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libssl-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  fedora-build:
    name: Fedora desktop build
    runs-on: ubuntu-24.04
    container: fedora:latest
    steps:
      - name: Install Fedora build dependencies
        run: |
          dnf install -y git curl gcc gcc-c++ make nodejs npm \
            webkit2gtk4.1-devel openssl-devel wget file \
            libappindicator-gtk3-devel librsvg2-devel libxdo-devel rpm-build
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: |
          export CARGO_HOME=/opt/branchcraft-cargo
          export RUSTUP_HOME=/opt/branchcraft-rustup
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          echo "/opt/branchcraft-cargo/bin" >> "$GITHUB_PATH"
          echo "CARGO_HOME=/opt/branchcraft-cargo" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=/opt/branchcraft-rustup" >> "$GITHUB_ENV"
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '^2.11' --locked
      - name: Build Branchcraft RPM
        run: cargo tauri build --config src-tauri/tauri.conf.json --bundles rpm
      - name: Upload RPM
        uses: actions/upload-artifact@v4
        with:
          name: branchcraft-rpm
          path: target/release/bundle/rpm/*.rpm
          if-no-files-found: error

  windows-build:
    name: Windows desktop build
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '^2.11' --locked
      - name: Build Branchcraft NSIS installer
        run: cargo tauri build --config src-tauri/tauri.conf.json --bundles nsis
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: branchcraft-windows-x64-installer
          path: target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

