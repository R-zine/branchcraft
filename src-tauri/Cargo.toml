[package]
name = "branchcraft"
description = "A fast, focused desktop Git client for Linux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
default-run = "branchcraft"

[lib]
name = "branchcraft_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "branchcraft"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
branchcraft-app-core = { path = "../crates/app-core" }
branchcraft-auth = { path = "../crates/auth" }
branchcraft-git = { path = "../crates/git" }
branchcraft-github = { path = "../crates/github" }
branchcraft-storage = { path = "../crates/storage" }
serde.workspace = true
tauri = { version = "2.11.6", features = [] }
tauri-plugin-dialog = "2.7.3"
tauri-plugin-opener = "2.5.5"
url.workspace = true

[lints]
workspace = true

