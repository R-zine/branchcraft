[workspace]
resolver = "2"
members = [
    "crates/app-core",
    "crates/auth",
    "crates/git",
    "crates/github",
    "crates/hooks",
    "crates/storage",
    "crates/test-support",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Branchcraft contributors"]
license = "MIT"
repository = "https://github.com/<username>/branchcraft"

[workspace.dependencies]
async-trait = "0.1.92"
base64 = "0.22.1"
git2 = "0.21.0"
keyring = "4.2.0"
rand = "0.10.3"
reqwest = { version = "0.13.5", features = ["form", "json"] }
secrecy = "0.10.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.0"
subtle = "2.6"
tempfile = "3.23"
thiserror = "2.0"
tokio = { version = "1.47", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
url = "2.5"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
strip = "symbols"

