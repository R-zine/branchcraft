[workspace]
resolver = "2"
members = [
    "crates/app-core",
    "crates/git",
    "crates/test-support",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/<username>/branchcraft"

[workspace.dependencies]
git2 = "0.21.0"
serde = { version = "1.0", features = ["derive"] }
tempfile = "3.23"
thiserror = "2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"

